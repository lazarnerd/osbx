name: flatpak
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: flatpak-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Flatpak and guest asset build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flatpak appstream cpio zstd kmod e2fsprogs
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08

      - name: Build guest assets
        run: ./guest/build-assets.sh --with-osbx

      - name: Build self-hosted Flatpak repo and bundle
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/flatpak-repo
        run: |
          ./scripts/build-flatpak.sh --output dist/flatpak --repo-url "$PAGES_URL"
          mkdir -p site/flatpak-repo
          cp -a dist/flatpak/repo/. site/flatpak-repo/
          cp -f dist/flatpak/osbx.flatpakrepo site/flatpak-repo/osbx.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: osbx-flatpak-x86_64
          path: |
            dist/flatpak/osbx-*.flatpak
            dist/flatpak/osbx.flatpakrepo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Attach bundle to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flatpak/osbx-*.flatpak
            dist/flatpak/osbx.flatpakrepo

  deploy-pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
