name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "third_party/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "third_party/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cargo_scope: --workspace
          - os: windows-2022
            cargo_scope: --workspace
          # macOS Hypervisor.framework backend not yet implemented: test portable crates + CLI stub.
          - os: macos-15
            cargo_scope: --workspace --exclude osbx-sandbox --exclude osbx-image
          # Linux aarch64 VMM backend not yet implemented: test arch-neutral crates + guest agent.
          - os: ubuntu-24.04-arm
            cargo_scope: --workspace --exclude osbx-vmm --exclude osbx-sandbox --exclude osbx-image --exclude osbx-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy ${{ matrix.cargo_scope }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.cargo_scope }}
