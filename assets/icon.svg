<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="shell-a" x1="18" y1="16" x2="86" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="shell-b" x1="110" y1="26" x2="44" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="40" y1="42" x2="88" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="40" y1="50" x2="64" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="88" y1="50" x2="64" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="64" cy="64" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft ambient aura behind the isolated core -->
  <circle cx="64" cy="64" r="42" fill="url(#core-glow)"/>

  <!-- Minimal containment alignment ticks -->
  <g stroke="#6366F1" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="round">
    <line x1="64" y1="21" x2="64" y2="30"/>
    <line x1="27" y1="85.5" x2="34.8" y2="81"/>
    <line x1="101" y1="85.5" x2="93.2" y2="81"/>
  </g>

  <!-- Outer split hexagonal isolation shell with dual proxy channels -->
  <path d="M 79.6 21 L 68.3 14.5 Q 64 12 59.7 14.5 L 23.3 35.5 Q 19 38 19 43 L 19 85 Q 19 90 23.3 92.5 L 34.6 99"
        stroke="url(#shell-a)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 93.4 29 L 104.7 35.5 Q 109 38 109 43 L 109 85 Q 109 90 104.7 92.5 L 68.3 113.5 Q 64 116 59.7 113.5 L 48.4 107"
        stroke="url(#shell-b)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating microVM core cube -->
  <g stroke-linejoin="round">
    <polygon points="64,37 87.38,50.5 64,64 40.62,50.5" fill="url(#cube-top)"/>
    <polygon points="40.62,50.5 64,64 64,91 40.62,77.5" fill="url(#cube-left)"/>
    <polygon points="64,64 87.38,50.5 87.38,77.5 64,91" fill="url(#cube-right)"/>

    <!-- Specular facet ridges -->
    <path d="M 41.2 50.8 L 64 64 L 86.8 50.8" stroke="#FFFFFF" stroke-opacity="0.68" stroke-width="1.35" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="64" y2="90.2" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="1.25" stroke-linecap="round"/>
    <path d="M 41.2 50.2 L 64 37.3 L 86.8 50.2" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
