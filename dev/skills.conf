# Skill manifest for install-skills.sh
#
#   repo  <id> <git-url> <commit-sha>      pinned source (never a branch name)
#   skill <repo-id> <path-in-repo> [as]    copy <path> to <dest>/<as|basename>
#
# Every repo is pinned to a full commit SHA so re-running the setup reproduces
# the same skills. Skills are instructions (and sometimes scripts) that the agent
# will follow with your privileges: review a repo before bumping its pin.
# Refresh pins with:  ./install-skills.sh --show-latest
#
# Licenses (check before redistributing): anthropics/skills = per-skill LICENSE.txt,
# Jeffallan = MIT, trailofbits = CC-BY-SA-4.0, zhanghandong = see repo.

repo anthropics https://github.com/anthropics/skills            e4bb5d960d87126ff3b3a8af1a104b7db67560ba
repo jeffallan  https://github.com/Jeffallan/claude-skills      d98d06edb54c25cfb94017c0ef830342a34a43ba
repo tob        https://github.com/trailofbits/skills           149d7b21f4067765b82e67029730b42d228ef4b4
repo rustskills https://github.com/zhanghandong/rust-skills     5c40d3ad785193231b7d0dbfb8e1eb447e5edd94

