[package]
name = "osbx-agent"
description = "osbx in-guest agent: exec, port tunnels and proxy egress over vsock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "osbx-agent"
path = "src/main.rs"

[dependencies]
osbx-proto = { path = "../osbx-proto" }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
