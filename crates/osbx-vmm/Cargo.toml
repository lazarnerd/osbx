[package]
name = "osbx-vmm"
description = "osbx virtual machine monitor: KVM (Linux) and Windows Hypervisor Platform backends, virtio devices, kvm@1 probing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Shared VMM (memory, loader, UART, virtio). Hypervisor backends below.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
vm-memory = { version = "=0.17.1", features = ["backend-mmap"] }
linux-loader = { version = "0.13.2", features = ["bzimage"] }
vm-superio = "0.8.2"
virtio-bindings = "0.2.7"
virtio-queue = "0.17"

# Linux/KVM backend.
[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = "0.14.2"
kvm-ioctls = "0.25.1"
libc = "0.2.191"
vmm-sys-util = "0.15.0"
fuse-backend-rs = { version = "0.14.0", features = ["virtiofs"] }

# Windows Hypervisor Platform backend.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Hypervisor", "Win32_System_Memory", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }

[dev-dependencies]
osbx-proto = { path = "../osbx-proto" }

[lints.rust]
# Hypervisor code needs unsafe. It is denied crate-wide and allowed only in modules that carry
# a `SAFETY:` comment on every unsafe block (see docs/PROVENANCE.md / docs/PLAN.md).
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
